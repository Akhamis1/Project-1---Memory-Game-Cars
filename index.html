<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Memory Game | Play</title>
  <link rel="stylesheet" href="./css/game.css">
  <script defer src="./js/app.js"></script>
</head>

<body>
  <h1>Find the Matching cars </h1>
  <h2 id="message">Choose two cards</h2>

  <section class="board">
    <div class="card" id="0">🏎️</div>
    <div class="card" id="1">🏎️</div>
    <div class="card" id="2">🏎️</div>
    <div class="card" id="3">🏎️</div>
    <div class="card" id="4">🏎️</div>
    <div class="card" id="5">🏎️</div>
    <div class="card" id="6">🏎️</div>
    <div class="card" id="7">🏎️</div>
    <div class="card" id="8">🏎️</div>
    <div class="card" id="9">🏎️</div>
    <div class="card" id="10">🏎️</div>
    <div class="card" id="11">🏎️</div>
  </section>

  <section id="game-details">
    <p class="game-info" id="score">🏆 Score: 0 / 6</p>

    <p class="game-info" id="duration">⌛ Duration: 0</p>

    <div class="game-info">
      <label for="difficulty">⚙️ Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <p class="game-info" id="lives">⛽ Lives: 10</p>
  </section>

  <button class="btn"  id="restart-btn">🔧 Restart Game</button>
  <button class="btn"  id="start-btn">Start 🏁</button>
</body>

</html>
